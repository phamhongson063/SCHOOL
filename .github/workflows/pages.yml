name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Keep file times
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            touch -d "@$(git log -1 --format=%ct -- "$file")" "$file"
          done
      - name: Stamp version
        run: |
          sed -i "s/VERSION = '[^']*'/VERSION = '${GITHUB_SHA::7}'/" src/version.js
          RELEASE=$(git log -1 --format=%s | grep -oE '^v[0-9]+(\.[0-9]+)*' || true)
          sed -i "s/RELEASE = '[^']*'/RELEASE = '${RELEASE:-dev}'/" src/version.js
      - name: List cached assets
        run: |
          ASSETS=$(git ls-files -s assets | awk '{ printf "\"%s\":\"%s\",", $4, substr($2, 1, 12) }')
          sed -i "s|const ASSETS = {};|const ASSETS = {${ASSETS%,}};|" sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
